name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger khi push tag phiên bản (ví dụ v1.0.1, v1.0.2)
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tên Tag phiên bản phát hành (ví dụ: v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore google-services.json
        working-directory: apps/frontend/android/app
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          elif [ -f "google-services.json.example" ]; then
            cp google-services.json.example google-services.json
          fi

      - name: Install Dependencies
        working-directory: apps/frontend
        run: flutter pub get

      - name: Build Release APK
        working-directory: apps/frontend
        run: |
          flutter build apk --release --dart-define=BACKEND_URL=https://tienlo.onrender.com/api
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TienLo-release.apk

      - name: Determine Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Tiên Lộ ${{ steps.get_tag.outputs.tag }} • Bản Cập Nhật
          draft: false
          prerelease: false
          generate_release_notes: true
          files: apps/frontend/build/app/outputs/flutter-apk/TienLo-release.apk
